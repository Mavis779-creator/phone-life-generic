function setWallpaper(){const src=assetSrc(state.wallpaperId)||CONFIG.wallpaper;const target=$('#lockLayer');if(src){target.style.backgroundImage=`url("${src}")`;$('.home-screen')?.style.setProperty('background-image',`linear-gradient(140deg,#1d294a22,#c08da722),url("${src}")`);}else{target.style.backgroundImage='linear-gradient(145deg,#1b2548,#726581 55%,#b1849c)';$('.home-screen')?.style.removeProperty('background-image');}}

function translateKakaoMessage(m){return m.translation||KAKAO_TRANSLATIONS[m.text]||translateAnyText(m.text)||'';}
function translateSocialText(text){return SOCIAL_TRANSLATIONS[text]||KAKAO_TRANSLATIONS[text]||translateAnyText(text)||'';}
function translateAnyText(text){if(!text)return '';const t=String(text).trim();return KAKAO_TRANSLATIONS[t]||SOCIAL_TRANSLATIONS[t]||INSTAGRAM_TRANSLATIONS[t]||'';}
function hasKorean(text){return /[가-힣]/.test(String(text||''));}
function socialAppFor(platform){return platform==='X'?'x':platform==='Threads'?'threads':platform==='TikTok'?'tiktok':'instagram-feed';}
function renderKakaoProfile(){const src=assetSrc(state.avatarId)||CONFIG.avatar;return `<div class="profile-full"><div class="profile-cover"><button class="close" data-action="back">‹</button><div class="profile-big-avatar">${src?`<img src="${esc(src)}">`:esc((state.profileName||'M').slice(0,1))}</div></div><div class="profile-content"><h2>${esc(state.profileName)}</h2><p>${esc(state.profileBio||'LUMI · 日常记录 ✧')}</p><span class="pill">我的资料</span><div style="margin-top:20px"><button class="profile-action" data-action="edit-profile">编辑资料</button><button class="profile-action" data-action="upload-avatar">更换头像</button></div><div style="border-top:1px solid #eee;margin-top:20px;padding-top:16px;font-size:13px;color:#888">资料仅显示在这部模拟手机中。</div></div></div>`;}
function getChatMessages(){if(activeChat==='default')return state.chatMessages;if(activeChat==='group-lumi'){if(!state.extraChats['group-lumi'])state.extraChats['group-lumi']=[{time:'07:52',text:'내일 집합 시간 다시 확인해 줘!',from:'상대'},{time:'07:55',text:'응, 11:30까지 B2로 가면 돼.',from:'상대'}];return state.extraChats['group-lumi'];}if(!state.extraChats[activeChat]){const f=CONFIG.friends[Number(activeChat)]||CONFIG.friends[0];state.extraChats[activeChat]=[{time:timeNow(),text:f.preview,from:'상대'}];}return state.extraChats[activeChat];}
function renderKakaoChat(){const friend=activeChat==='default'?{name:CONFIG.contactName,status:'在线'}:activeChat==='group-lumi'?{name:'LUMI 练习室',status:'3 人在线',tone:'purple'}:CONFIG.friends[Number(activeChat)]||CONFIG.friends[0];const friendContact=CONFIG.friends.find(f=>f.name===friend.name)||friend;const msgs=getChatMessages();return `<div class="kakao-chat"><div class="kakao-chat-header"><button data-action="back" aria-label="返回">‹</button><div class="title">${esc(friend.name)}<div class="chat-status">${esc(statusZh(friend.status||''))}</div></div><div class="kakao-chat-tools"><button data-action="kakao-call" aria-label="语音通话">☎</button><button data-action="kakao-video" aria-label="视频通话">▣</button><button data-action="kakao-room-menu" aria-label="聊天设置">☰</button></div></div><div class="kakao-history" id="kakaoHistory"><div class="chat-date-pill">${dateKorean()}</div>${msgs.map((m,mi)=>{const tr=translateKakaoMessage(m);return `<div class="chat-line ${m.from==='나'?'me':''}">${m.from==='나'?'':friendAvatarHtml(friendContact,'chat-avatar')}<div class="chat-bubble-wrap"><div class="chat-bubble"><div class="chat-original">${esc(m.text)}</div>${tr&&hasKorean(m.text)?`<div class="chat-translation-auto"><b>中文</b>${esc(tr)}</div>`:''}</div></div><div class="chat-meta">${esc(chatTimeText(m,mi,msgs.length))}${m.from==='나'?'<span class="unread">1</span>':''}</div></div>`;}).join('')}</div><form class="kakao-compose" id="kakaoForm"><button type="button" data-action="kakao-attachment" aria-label="添加附件">＋</button><textarea id="kakaoInput" rows="1" placeholder="输入消息…"></textarea><button type="submit">发送</button></form></div>`;}
function socialPostAvatarHtml(post,platform){const a=account(platform);const handle=post.handle||a.handle;if(post.avatarId){const src=assetSrc(post.avatarId);if(src)return `<div class="avatar"><img src="${esc(src)}"></div>`;}if(handle===a.handle||post.display===a.name)return profileAvatarHtml();const friend=CONFIG.friends.find(f=>f.handle===handle);if(friend)return friendAvatarHtml(friend);return `<div class="avatar">${esc((post.display||'M').slice(0,1))}</div>`;}
function socialData(platform){if(!state.socialPosts[platform])state.socialPosts[platform]=[];return state.socialPosts[platform];}
function socialPostHtml(post,platform,index){const a=account(platform);const dark=platform==='X';const avatarHtml=socialPostAvatarHtml(post,platform);const image=post.assetId?assetSrc(post.assetId):post.image||'';const who=post.display||a.name;const handle=post.handle||a.handle;const liked=!!state.liked[platform+'-'+post.id];const count=Number(post.likes||0)+(liked?1:0);const lock=a.private&&platform==='X'&&handle===a.handle?'🔒':'';const text=post.text||post.caption||'';const tr=translateSocialText(text);const tkey=platform+'-'+post.id;const translated=!!state.postTranslation[tkey];return `<article class="social-post"><div class="post-head">${avatarHtml}<div class="post-who"><div class="post-name">${esc(who)} ${lock?`<span style="font-size:11px">${lock}</span>`:''}<span class="post-handle">@${esc(handle)}</span><span class="post-date">· ${esc(post.date||'刚刚')}</span></div></div><button class="post-action" data-action="post-more" data-platform="${platform}" data-postid="${post.id}">•••</button></div><div class="post-text">${esc(text)}</div>${tr&&hasKorean(text)?`<button class="social-translate" data-action="translate-post" data-platform="${platform}" data-postid="${esc(post.id)}">${translated?'收起翻译':'查看中文翻译'}</button>${translated?`<div class="social-translation">${esc(tr)}</div>`:''}`:''}${image?`<img class="post-image" src="${esc(image)}" alt="帖子照片">`:''}<div class="post-actions"><button class="post-action" data-action="reply-post" data-platform="${platform}" data-postid="${post.id}">♡ <span>${post.replies||Math.floor((post.likes||0)*.03)}</span></button><button class="post-action" data-action="repost" data-platform="${platform}" data-postid="${post.id}">⟳ <span>${post.reposts||Math.floor((post.likes||0)*.01)}</span></button><button class="post-action ${liked?'liked':''}" data-action="like-post" data-platform="${platform}" data-postid="${post.id}">${liked?'♥':'♡'} <span>${count}</span></button><button class="post-action" data-action="share-post" data-platform="${platform}" data-postid="${post.id}">↗</button></div></article>`;}
function seedPosts(platform){const a=account(platform);const custom=socialData(platform);const base=CONFIG.tweets.map((text,i)=>({id:'seed-'+platform+'-'+i,display:i===0?'LUMI Official':i===1?'Yuna':i===2?'Minseo':'Mavis',handle:i===0?'lumi_official':i===1?'yuna.zip':i===2?'minseo.log':a.handle,text,likes:[12840,5821,3902,2086][i],date:postTimeText(i),replies:[214,87,65,31][i],reposts:[42,12,18,6][i]}));return [...custom,...base];}
function renderSocialBottom(platform,active='home'){const labels=platform==='X'?[['home','⌂','首页'],['search','⌕','搜索'],['grok','✧','Grok'],['activity','♡','通知'],['messages','✉','私信']]:platform==='Instagram'?[['home','⌂','首页'],['search','⌕','搜索'],['reels','▣','Reels'],['activity','♡','动态'],['me','●','个人主页']]:platform==='Threads'?[['home','⌂','主页'],['search','⌕','搜索'],['compose','＋','发布'],['activity','♡','活动'],['me','●','个人主页']]:[['home','⌂','首页'],['search','⌕','搜索'],['compose','＋','发布'],['activity','♡','收件箱'],['me','●','个人主页']];return `<div class="social-bottom social-bottom-${platform.toLowerCase()}">${labels.map(([id,ico,label])=>`<button class="${id===active?'active':''}" data-social-nav="${id}" data-platform="${platform}"><span class="tab-ico">${ico}</span><span>${label}</span></button>`).join('')}</div>`;}
function renderSocial(platform){currentSocial=platform;if(platform==='Instagram')return renderInstagramFeed();const a=account(platform);const dark=platform==='X';const title=platform==='X'?'𝕏':'Threads';const profile=currentSocialTab==='me';const profileTabs=platform==='X'?[['posts','帖子'],['replies','回复'],['media','媒体'],['likes','喜欢']]:[['posts','帖子'],['replies','回复'],['media','媒体'],['reposts','转帖']];let body='';if(profile){let posts=seedPosts(platform).filter(p=>p.handle===a.handle||p.display==='Mavis');if(currentProfileTab==='media')posts=posts.filter(p=>p.image||p.assetId);if(currentProfileTab==='replies')posts=[];if(currentProfileTab==='likes')posts=posts.filter(p=>state.liked[platform+'-'+p.id]);body=`<div class="profile-social"><div class="profile-banner"></div><div class="profile-social-row">${a.avatar?`<div class="avatar profile-account-avatar"><img src="${esc(a.avatar)}"></div>`:profileAvatarHtml()}<button class="primary-outline" data-action="account-picker" data-platform="${platform}">切换账号</button></div><h2>${esc(a.name)} ${a.private?'🔒':''}</h2><div class="handle">@${esc(a.handle)}${a.private?' · 私密账号':''}</div><p>${esc(a.bio)}</p><div class="profile-stats"><span><b>${esc(a.followers)}</b> 粉丝</span><span><b>${platform==='X'?'124':'86'}</b> 正在关注</span></div><div style="display:flex;gap:8px;margin-top:14px"><button class="primary-outline" data-action="compose" data-platform="${platform}">编辑/发布</button><button class="primary-outline" data-action="account-manager">管理所有账号</button></div></div><div class="profile-tabs">${profileTabs.map(([id,label])=>`<button class="${currentProfileTab===id?'active':''}" data-profile-tab="${id}" data-platform="${platform}">${label}</button>`).join('')}</div>${posts.map((p,i)=>socialPostHtml(p,platform,i)).join('')||`<div class="empty-state">${currentProfileTab==='replies'?'还没有回复。':currentProfileTab==='likes'?'还没有喜欢的帖子。':currentProfileTab==='media'?'还没有媒体内容。':'这里还没有帖子。'}</div>`}`;}else{const tabs=platform==='X'?[['for-you','为你推荐' function renderInstagramFeed(){const a=account('Instagram');const profile=currentSocialTab==='me';const photos=state.photos.filter(p=>p.assetId||p.src);const posts=seedPosts('Instagram');if(profile){const tiles=photos.length?photos.map(p=>`<button class="ig-grid-tile" data-photo="${esc(p.id)}"><img src="${esc(p.assetId?assetSrc(p.assetId):p.src)}"></button>`).join(''):state.photos.map((p,i)=>`<button class="ig-grid-tile ig-art ig-art-${i%4}" data-photo="${esc(p.id)}"><span>${esc(p.art||'✦')}</span></button>`).join('');return `<div class="instagram-page"><div class="ig-profile-top"><button data-action="account-picker" data-platform="Instagram" aria-label="切换账号">⌄</button><strong>${esc(a.handle)}</strong><div style="display:flex;gap:15px;align-items:center"><button data-action="compose" data-platform="Instagram" aria-label="新帖子">＋</button><button data-action="account-manager" aria-label="账号设置">☰</button></div></div><div class="app-scroll"><div class="ig-profile-head"><div class="ig-profile-row">${a.avatar?`<div class="avatar ig-profile-avatar"><img src="${esc(a.avatar)}"></div>`:profileAvatarHtml()}</div><div class="ig-profile-stats"><span><b>${esc(a.followers)}</b><small>帖子</small></span><span><b>86</b><small>粉丝</small></span><span><b>124</b><small>正在关注</small></span></div></div><h2 class="ig-profile-name">${esc(a.name)} ${a.private?'🔒':''}</h2><div class="ig-profile-bio">${esc(a.bio)}</div><div class="ig-profile-buttons"><button data-action="edit-profile">编辑个人资料</button><button data-action="account-picker" data-platform="Instagram">切换账号</button></div><div class="ig-profile-tabs"><button class="active">▦</button><button>▣</button><button>♙</button></div><div class="ig-grid">${tiles}</div><div class="ig-open-accounts"><button data-action="account-manager">管理 X / Instagram / Threads / TikTok 账号</button></div></div>${renderSocialBottom('Instagram','me')}</div>`;}const stories=[{name:'你的动态',own:true},...CONFIG.friends.slice(0,5).map(f=>({name:f.name,avatar:f.avatar}))];const storyHtml=stories.map((st,i)=>`<button class="ig-story"><span class="ig-story-ring ${st.own?'own':''}">${st.avatar?`<img src="${esc(st.avatar)}">`:`<span>${st.own?esc((state.profileName||'我').slice(0,1)):esc(st.name.slice(0,1))}</span>`}</span><small>${esc(st.name)}</small></button>`).join('');const feed=posts.map((p,i)=>{const ownPhoto=photos[i%Math.max(1,photos.length)];const src=p.assetId?assetSrc(p.assetId):p.image||(ownPhoto?(ownPhoto.assetId?assetSrc(ownPhoto.assetId):ownPhoto.src):'');const liked=!!state.liked['Instagram-'+p.id];return `<article class="ig-post"><div class="ig-post-head">${socialPostAvatarHtml(p,'Instagram')}<div class="ig-post-who"><strong>${esc(p.display||a.name)}</strong><small>@${esc(p.handle||a.handle)} · ${esc(p.date||'刚刚')}</small></div><button data-action="post-more" data-platform="Instagram" data-postid="${esc(p.id)}">•••</button></div>${src?`<img class="ig-post-photo" src="${esc(src)}" alt="帖子照片">`:`<div class="ig-post-photo ig-art ig-art-${i%4}"><span>${['☕','🌃','🎧','✦'][i%4]}</span></div>`}<div class="ig-post-actions"><button class="${liked?'liked':''}" data-action="like-post" data-platform="Instagram" data-postid="${esc(p.id)}">${liked?'♥':'♡'}</button><button data-action="reply-post" data-platform="Instagram" data-postid="${esc(p.id)}">♧</button><button data-action="share-post" data-platform="Instagram" data-postid="${esc(p.id)}">➤</button><button class="save-post" data-action="save-ig-post" data-postid="${esc(p.id)}">♧</button></div><div class="ig-post-likes">${(Number(p.likes||0)+(liked?1:0)).toLocaleString('zh-CN')} 次赞</div><div class="ig-post-caption"><strong>${esc(p.display||a.name)}</strong> ${esc(p.text||'')}</div>${translateSocialText(p.text||'')&&hasKorean(p.text||'')?`<button class="ig-translate" data-action="translate-post" data-platform="Instagram" data-postid="${esc(p.id)}">${state.postTranslation['Instagram-'+p.id]?'收起翻译':'查看中文翻译'}</button>${state.postTranslation['Instagram-'+p.id]?`<div class="social-translati async function boot(){assetDB=await initDB();await dbLoadAll();if(state.wallpaperId&&!assetUrls[state.wallpaperId])state.wallpaperId=null;if(state.avatarId&&!assetUrls[state.avatarId])state.avatarId=null;$('#appContent').innerHTML=renderHome();setWallpaper();renderLockNotifications();updateClock();bindEvents();handleRouteActions();if(state.unlocked){lockLayer.classList.add('hidden');renderApp('home');}else{lockLayer.classList.remove('hidden');}setInterval(updateClock,1000);setInterval(()=>{if(currentApp==='spotify'&&state.spotifyPlaying&&state.currentTrack>=0&&!spotifyAudio){const t=CONFIG.spotify.tracks[state.currentTrack];state.spotifyProgress=(state.spotifyProgress||0)+1;if(state.spotifyProgress>=t.duration){if(state.spotifyRepeat)state.spotifyProgress=0;else{spotifyNext();return;}}if($('#miniProgress'))$('#miniProgress').style.width=(state.spotifyProgress/t.duration*100)+'%';if($('#spotifySeek'))$('#spotifySeek').value=state.spotifyProgress;if($('#spotifyElapsed'))$('#spotifyElapsed').textContent=formatDuration(state.spotifyProgress);saveState();}},1000);setInterval(()=>{if(document.hidden||callActive)return;const nowMs=Date.now();if(nowMs-(state.lastIncomingAt||0)>85000&&Math.random()<.42){state.lastIncomingAt=nowMs;const friendIndex=Math.floor(Math.random()*Math.min(3,CONFIG.friends.length));const f=CONFIG.friends[friendIndex];const targetId=f.name===CONFIG.contactName?'default':String(friendIndex);const texts=['연습 끝나면 잠깐 통화할래?','오늘 사진 찍었어? 나중에 보여 줘 ㅋㅋ','아까 안무 영상 확인했어? 그 부분 좋더라.','점심 뭐 먹을 거야?'];const text=texts[Math.floor(Math.random()*texts.length)];if(targetId==='default')state.chatMessages.push({time:timeNow(),text,from:'상대'});else{if(!state.extraChats[targetId])state.extraChats[targetId]=[{time:timeNow(),text:f.preview,from:'상대'}];state.extraChats[targetId].push({time:timeNow(),text,from:'상대'});}addNotification('KakaoTalk',f.name,text);if(currentApp==='kakao-chat'&&activeChat===targetId)renderApp('kakao-chat');else showToast(f.name,text);saveState();}},15000);}
boot();
</script>
